<helmet>
  <style>
    :root{--bg:#0d1014;--panel:#161b22;--panel2:#1d232c;--line:#262d38;--txt:#e7ecf2;--muted:#8b95a3;--dim:#5c6672;--hit:#22c55e;--hr:#f59e0b;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
    body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;width:390px;padding:0 0 20px;}
    a{color:var(--hit);} a:hover{color:#16a34a;}
    .top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
    .top h1{font-size:19px;font-weight:800;}
    .top .who{font-size:12px;color:var(--muted);}
    .tabs{display:flex;gap:8px;margin:6px 16px 0;}
    .tab{font-size:13px;font-weight:700;padding:7px 14px;border-radius:9px;border:1px solid var(--line);color:var(--muted);background:var(--panel);}
    .tab.on{color:#7ee2a4;border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08);}
    .lead{margin:12px 16px 0;background:linear-gradient(160deg,rgba(34,197,94,.10),var(--panel));border:1px solid var(--line);border-radius:16px;padding:15px 17px;}
    .lead .nm{font-size:17px;font-weight:800;}
    .lead .nm span{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px;}
    .lead .row{display:flex;gap:16px;margin-top:12px;}
    .lead .s{display:flex;flex-direction:column;gap:2px;}
    .lead .s b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
    .lead .s b.g{color:#7ee2a4;}
    .lead .s span{font-size:10px;color:var(--muted);}
    .sect{font-size:10px;color:var(--dim);letter-spacing:1.5px;font-weight:700;margin:18px 16px 6px;}
    .tbl{margin:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
    table{width:100%;border-collapse:separate;border-spacing:0;}
    thead th{font-size:10px;color:var(--muted);font-weight:700;padding:9px 4px;text-align:center;}
    th.nm2{text-align:left;padding-left:14px;}
    tbody td{font-size:13px;padding:10px 4px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;}
    td.nm2{text-align:left;padding-left:14px;font-weight:700;}
    td.nm2 .ord{color:var(--dim);font-weight:800;margin-right:8px;font-size:11px;}
    td.avg{color:#7ee2a4;font-weight:800;}
    td.ops{color:var(--txt);font-weight:700;}
    td.dim{color:var(--muted);}
  </style>
</helmet>
