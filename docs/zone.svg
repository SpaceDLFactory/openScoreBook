<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>코스 번호: 포수 시점, 존 안 1–9, 존 밖 11–14</title>
  <rect width="360" height="330" rx="16" fill="#0d1014"/>
  <!-- outside the zone: four quadrants -->
  <g fill="#161b22" stroke="#2b3440" stroke-width="1.5">
    <rect x="40" y="20" width="140" height="130" rx="10"/>
    <rect x="180" y="20" width="140" height="130" rx="10"/>
    <rect x="40" y="150" width="140" height="130" rx="10"/>
    <rect x="180" y="150" width="140" height="130" rx="10"/>
  </g>
  <g fill="#8b95a3" font-size="20" font-weight="600" text-anchor="middle">
    <text x="72" y="52">11</text><text x="288" y="52">12</text>
    <text x="72" y="264">13</text><text x="288" y="264">14</text>
  </g>
  <!-- the zone: 3 x 3 -->
  <rect x="103" y="67" width="154" height="166" rx="6" fill="#0d1014"/>
  <g fill="rgba(34,197,94,.10)" stroke="#3a5a44" stroke-width="1.5">
    <rect x="105" y="69" width="50" height="54"/><rect x="155" y="69" width="50" height="54"/><rect x="205" y="69" width="50" height="54"/>
    <rect x="105" y="123" width="50" height="54"/><rect x="155" y="123" width="50" height="54"/><rect x="205" y="123" width="50" height="54"/>
    <rect x="105" y="177" width="50" height="54"/><rect x="155" y="177" width="50" height="54"/><rect x="205" y="177" width="50" height="54"/>
  </g>
  <rect x="105" y="69" width="150" height="162" fill="none" stroke="#22c55e" stroke-width="2"/>
  <g fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">
    <text x="130" y="104">1</text><text x="180" y="104">2</text><text x="230" y="104">3</text>
    <text x="130" y="158">4</text><text x="180" y="158">5</text><text x="230" y="158">6</text>
    <text x="130" y="212">7</text><text x="180" y="212">8</text><text x="230" y="212">9</text>
  </g>
  <!-- home plate, catcher's view -->
  <path d="M155 292 H205 V300 L180 312 L155 300 Z" fill="#e6edf3" opacity=".85"/>
  <text x="180" y="324" fill="#5c6672" font-size="11" text-anchor="middle">포수 시점</text>
</svg>
