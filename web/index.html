<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KBO 직관 스코어북</title>
<style>
  :root{--bg:#0d1014;--panel:#161b22;--panel2:#1d232c;--line:#262d38;--txt:#e7ecf2;--muted:#8b95a3;--dim:#5c6672;--strike:#f59e0b;--ball:#3b82f6;--foul:#8b95a3;--inplay:#22c55e;--out:#ef4444;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;max-width:390px;margin:0 auto;padding-bottom:24px;}
  button{font:inherit;color:inherit;cursor:pointer;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 8px;}
  .top .ico{color:var(--muted);font-size:20px;width:36px;height:32px;background:none;border:none;}
  .top .mid{font-size:13px;font-weight:700;text-align:center;}
  .top .mid .dim{color:var(--muted);font-weight:500;}
  .mu{display:flex;align-items:center;gap:10px;margin:2px 12px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
  .mu .side{display:flex;flex-direction:column;gap:2px;}
  .mu .r{font-size:9px;color:var(--dim);letter-spacing:1px;font-weight:700;}
  .mu .n{font-size:15px;font-weight:700;}
  .mu .s{font-size:10px;color:var(--muted);}
  .mu .arw{color:var(--dim);font-size:16px;margin:0 2px;}
  .mu .cnt{margin-left:auto;text-align:right;}
  .mu .bs{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
  .mu .o{font-size:10px;color:var(--out);font-weight:700;margin-top:1px;}
  .zonewrap{display:flex;gap:12px;margin:12px 12px 0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .zonecard{flex:1;display:flex;flex-direction:column;align-items:center;}
  .cap{font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:700;align-self:flex-start;margin-bottom:6px;}
  .leg{width:96px;display:flex;flex-direction:column;gap:9px;justify-content:center;}
  .leg .it{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);}
  .leg .d{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
  .leg .src{margin-top:4px;font-size:10px;color:var(--dim);line-height:1.4;}
  .log{margin:12px 12px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .log .r{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:12px;}
  .log .r:last-child{border-bottom:none;}
  .log .pn{width:20px;height:20px;border-radius:6px;background:var(--panel2);font-size:11px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;}
  .log .ty{font-weight:700;width:56px;}
  .log .ve{color:var(--muted);width:52px;}
  .log .rs{margin-left:auto;font-weight:700;}
  .log .ev{color:var(--muted);font-size:11px;padding:7px 13px;border-bottom:1px solid var(--line);}
  .result{margin:12px 12px 0;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:700;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.35);color:#7ee2a4;}
  .result.out{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.3);color:#fca5a5;}
  .sect{font-size:10px;color:var(--dim);letter-spacing:1.5px;font-weight:700;margin:14px 14px 6px;display:flex;justify-content:space-between;}
  .sect .saved{color:var(--inplay);letter-spacing:0;}
  .fieldcard{margin:0 12px;padding:6px;}
  #field{display:block;width:100%;touch-action:manipulation;}
  .chips{display:flex;gap:6px;margin:8px 12px 0;}
  .chips.res{flex-wrap:wrap;}
  .chips.res .chip{flex:0 0 calc(25% - 4.5px);height:34px;font-size:12px;}
  .pathbar{display:flex;gap:6px;align-items:center;margin:8px 12px 0;}
  .pathbar button{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;color:var(--muted);}
  .pathbar span{margin-left:auto;font-size:11px;color:var(--dim);}
  .fnote{font-size:10px;color:var(--dim);margin:6px 14px 0;text-align:right;}
  .chip{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;}
  .chip.sel{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.10);color:#7ee2a4;}
  .nav{display:flex;gap:8px;margin:14px 12px 0;}
  .nav button{flex:1;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;}
  .nav .next{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.12);color:#7ee2a4;}
  .foot{margin:14px 12px 0;font-size:11px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;}
  .foot button{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--muted);font-size:11px;}
  body{padding-bottom:84px;}
  .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;display:flex;background:rgba(13,16,20,.96);border-top:1px solid var(--line);padding:6px 6px 14px;backdrop-filter:blur(8px);}
  .tabs button{flex:1;height:40px;background:none;border:none;color:var(--dim);font-size:12px;font-weight:700;border-radius:9px;}
  .tabs button.on{color:var(--txt);background:var(--panel2);}
  .h1{font-size:17px;font-weight:800;margin:14px 14px 2px;}
  .sub{font-size:11px;color:var(--muted);margin:0 14px 4px;}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  .tbl{margin:8px 12px 0;padding:4px 0;overflow:hidden;}
  .tbl th{font-size:10px;color:var(--dim);font-weight:700;padding:7px 4px;text-align:right;}
  .tbl td{font-size:12px;padding:7px 4px;text-align:right;border-top:1px solid var(--line);}
  .tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:12px;}
  .tbl td:last-child,.tbl th:last-child{padding-right:12px;}
  .tbl .pos{color:var(--dim);font-size:10px;margin-left:4px;}
  .tbl .subp td:first-child{padding-left:24px;color:var(--muted);}
  .tbl .tot td{font-weight:800;}
  .ls td,.ls th{text-align:center !important;padding:7px 2px !important;}
  .ls td:first-child,.ls th:first-child{text-align:left !important;padding-left:12px !important;}
  .ls .rhe{font-weight:800;}
  .half{font-size:10px;color:var(--dim);letter-spacing:1.5px;font-weight:700;margin:16px 14px 6px;}
  .pa{display:flex;gap:10px;align-items:flex-start;margin:0 12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-top:none;cursor:pointer;}
  .half + .pa{border-top:1px solid var(--line);border-radius:12px 12px 0 0;}
  .pa.last{border-radius:0 0 12px 12px;}
  .half + .pa.last{border-radius:12px;}
  .pa .who{width:62px;font-size:12px;font-weight:700;flex-shrink:0;}
  .pa .who small{display:block;color:var(--dim);font-size:10px;font-weight:600;margin-top:2px;}
  .pa .what{flex:1;font-size:12px;line-height:1.45;}
  .pa .seq{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;}
  .pa .seq i{font-style:normal;font-size:10px;font-weight:800;width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#0d1014;}
  .pa .sc{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;}
  .pa .sc.chg{color:var(--inplay);}
  .pchips{display:flex;gap:6px;margin:10px 12px 0;overflow-x:auto;padding-bottom:2px;}
  .pchips button{flex-shrink:0;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;}
  .pchips button.on{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.10);color:#7ee2a4;}
  .kpis{display:flex;gap:6px;margin:10px 12px 0;}
  .kpi{flex:1;padding:10px 8px;text-align:center;}
  .kpi b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
  .kpi span{font-size:10px;color:var(--dim);font-weight:700;}
  .mix{margin:8px 12px 0;padding:6px 12px;}
  .mix .row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;}
  .mix .nm{width:72px;white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:6px;}
  .mix .dot{width:9px;height:9px;border-radius:50%;}
  .mix .bar{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;}
  .mix .bar div{height:100%;border-radius:4px;}
  .mix .pct{width:34px;text-align:right;font-variant-numeric:tabular-nums;}
  .mix .v{width:48px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}
  .zc{margin:8px 12px 0;display:flex;justify-content:center;padding:10px;}
  .wpc{margin:8px 12px 0;padding:10px 6px 6px;}
  .swing{display:flex;gap:10px;align-items:center;margin:0 12px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-top:none;}
  .swings .swing:first-child{border-top:1px solid var(--line);border-radius:12px 12px 0 0;}
  .swings .swing:last-child{border-radius:0 0 12px 12px;}
  .swing .rk{width:22px;height:22px;border-radius:7px;background:var(--panel2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .swing .tx{flex:1;font-size:12px;line-height:1.4;}
  .swing .tx small{display:block;color:var(--dim);font-size:10px;}
  .swing .d{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
  .err{margin:40px 16px;color:var(--out);font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const GAME = new URLSearchParams(location.search).get('game') || '55551030SSHT02026';
const DIR = `../fixtures/naver/${GAME}`;
const STORE = `scorebook:landings:${GAME}`;
const CALL = {B:['볼','var(--ball)'], T:['루킹 스트라이크','var(--strike)'], S:['헛스윙','var(--strike)'], F:['파울','var(--foul)'], H:['타격','var(--inplay)']};
const TRAJ = ['땅볼','라이너','플라이','번트'];
// Batted-ball result classes, auto-derived from Naver's PA result text; user can override.
const RES = [['1B','1루타','#22c55e'],['2B','2루타','#14b8a6'],['3B','3루타','#a855f7'],['HR','홈런','#f59e0b'],
             ['OUT','아웃','#8b95a3'],['E','실책','#ef4444'],['ETC','야선·희생','#64748b']];
const RES_COL = Object.fromEntries(RES.map(([k,,c]) => [k, c]));
function classify(t){
  if (!t) return null;
  if (/홈런/.test(t)) return 'HR';
  if (/3루타/.test(t)) return '3B';
  if (/2루타/.test(t)) return '2B';
  if (/1루타|내야안타/.test(t)) return '1B';
  if (/실책/.test(t)) return 'E';
  if (/야수선택|땅볼로 출루|희생/.test(t)) return 'ETC';
  if (/아웃/.test(t)) return 'OUT';
  return 'ETC';
}
// Fence distances (m) at LF line, LCF, CF, RCF, RF. null = unknown, interpolated.
// src: 'ok' = press/public data, 'comm' = community table only, 'est' = guessed.
const STADIUMS = {
  잠실: {f:[100,120,125,120,100], src:['ok','comm','ok','comm','ok']},
  고척: {f:[99,null,122,null,99], src:['ok','est','ok','est','ok']},
  문학: {f:[95,115,120,115,95], src:['est','comm','comm','comm','est']},
  대구: {f:[99.5,107,122.5,107,99.5], src:['ok','ok','ok','ok','ok'], straight:true},
  사직: {f:[95,113,121,113,95], src:['est','comm','comm','comm','est']},
  창원: {f:[101,116,122,116,101], src:['est','comm','comm','comm','est']},
  수원: {f:[98,115,120,115,98], src:['est','comm','comm','comm','est']},
  대전: {f:[99,115,122,112,95], src:['ok','ok','ok','ok','ok']},
  광주: {f:[99,null,121,null,99], src:['est','est','est','est','est']},
};
const DEFAULT_FENCE = {f:[99,null,122,null,99], src:['est','est','est','est','est']};

let G, idx = 0, view = 'chart', pitcherSel = null;
let landings = {};
try { landings = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch {}
for (const v of Object.values(landings)) if (v.unit !== 'm'){ v.x = Math.round(v.x*0.3048); v.y = Math.round(v.y*0.3048); v.unit = 'm'; }

// Height where the pitch crosses y = crossPlateY. Naver's crossPlateY is the
// plate-plane position (constant 0.7083 ft), not a height, so solve the trajectory.
function plateXZ(p){
  const a = 0.5*p.ay, b = p.vy0, c = p.y0 - p.crossPlateY;
  const t = (-b - Math.sqrt(b*b - 4*a*c)) / (2*a);
  return [p.crossPlateX, p.z0 + p.vz0*t + 0.5*p.az*t*t];
}

async function load(){
  const innings = window.INLINE_INNINGS ? [...window.INLINE_INNINGS] : [];
  let meta = window.INLINE_GAME || null;
  if (!meta){ try { const r = await fetch(`${DIR}/game.json`); if (r.ok) meta = await r.json(); } catch {} }
  for (let i = 1; !window.INLINE_INNINGS && i <= 15; i++){
    const r = await fetch(`${DIR}/inning-${i}.json`);
    if (!r.ok) break;
    innings.push((await r.json()).result.textRelayData);
  }
  if (!innings.length) throw new Error(`fixture 없음: ${DIR}/inning-1.json`);
  const names = {}, hands = {};
  for (const t of innings) for (const side of ['homeLineup','awayLineup']) for (const k of ['batter','pitcher'])
    for (const p of t[side][k]){ names[p.pcode] = p.name; if (p.hitType) hands[p.pcode] = p.hitType; }
  const away = innings[0].awayLineup, home = innings[0].homeLineup;
  const pas = [], pitchCount = {};
  for (const t of innings){
    const relays = [...t.textRelays].sort((a,b) => a.no - b.no);
    for (const r of relays){
      const opts = [...r.textOptions].sort((a,b) => a.seqno - b.seqno);
      if (!opts.length || opts[0].type !== 8) continue;   // only batter plate appearances
      const pts = Object.fromEntries(r.ptsOptions.map(p => [p.pitchId, p]));
      const before = opts[0].currentGameState;
      const pitches = [], events = [];
      let result = null;
      for (const o of opts.slice(1)){
        if (o.type === 1){
          // attribute each pitch to the pitcher on the mound at that moment (mid-PA changes happen)
          const pc = o.currentGameState.pitcher;
          pitchCount[pc] = (pitchCount[pc] || 0) + 1;
          const p = pts[o.ptsPitchId];
          pitches.push({pitcher:pc, n:o.pitchNum, call:o.pitchResult, speed:o.speed, stuff:o.stuff, xz: p ? plateXZ(p) : null, sz: p ? [p.bottomSz, p.topSz] : null, state:o.currentGameState});
        } else if (o.type === 13 || o.type === 23){ result = o.text; }
        else if (o.text) events.push(o.text);
      }
      if (!pitches.length) continue;
      const after = opts[opts.length - 1].currentGameState;
      const lastPitcher = pitches[pitches.length-1].pitcher;
      pas.push({wp: r.metricOption, no:r.no, inn:r.inn, top:r.homeOrAway === '0', title:r.title, batter:before.batter, pitcher:lastPitcher,
        pitcherPitches:pitchCount[lastPitcher], pitches, result, events, before, after,
        inPlay: pitches[pitches.length-1].call === 'H', res: classify(result)});
    }
  }
  const last = innings[innings.length-1];
  return {meta, stadium: meta?.stadium || null, fence: STADIUMS[meta?.stadium] || DEFAULT_FENCE, pas, names, hands, lineups:{away:last.awayLineup, home:last.homeLineup}, inningScore:last.inningScore, awayName: meta?.awayTeamName || teamName(innings[0], 'away'), homeName: meta?.homeTeamName || teamName(innings[0], 'home')};
}
function teamName(t, side){ return {SS:'삼성',HT:'KIA',LG:'LG',OB:'두산',KT:'KT',SK:'SSG',NC:'NC',LT:'롯데',HH:'한화',WO:'키움'}[GAME.slice(side==='away'?8:10, side==='away'?10:12)] || side; }

function zoneSVG(pa){
  const W=164, H=196, sx = x => W/2 + x*40, sz = z => H - 12 - z*36;
  const [b, t] = pa.pitches.find(p => p.sz)?.sz || [1.6, 3.4];
  const zx0 = sx(-0.708), zx1 = sx(0.708), zy0 = sz(t), zy1 = sz(b);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect x="1" y="1" width="${W-2}" height="${H-2}" rx="8" fill="rgba(255,255,255,.012)" stroke="#1e2630"/>
    <rect x="${zx0}" y="${zy0}" width="${zx1-zx0}" height="${zy1-zy0}" fill="rgba(245,158,11,.05)" stroke="#4a5566" stroke-width="1.5"/>`;
  for (const f of [1/3, 2/3]){
    s += `<line x1="${zx0+(zx1-zx0)*f}" y1="${zy0}" x2="${zx0+(zx1-zx0)*f}" y2="${zy1}" stroke="#2b333f"/>`;
    s += `<line x1="${zx0}" y1="${zy0+(zy1-zy0)*f}" x2="${zx1}" y2="${zy0+(zy1-zy0)*f}" stroke="#2b333f"/>`;
  }
  s += `<path d="M${sx(-0.708)} ${H-8} L${sx(0.708)} ${H-8}" stroke="#4a5566" stroke-width="2"/>`;
  for (const p of pa.pitches){
    if (!p.xz) continue;
    const cx = Math.max(10, Math.min(W-10, sx(p.xz[0]))), cy = Math.max(10, Math.min(H-10, sz(p.xz[1])));
    const col = CALL[p.call]?.[1] || 'var(--foul)';
    s += p.call === 'H'
      ? `<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="3 3"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#7ee2a4">${p.n}</text>`
      : `<circle cx="${cx}" cy="${cy}" r="10" fill="${col}" opacity=".95"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#0d1014">${p.n}</text>`;
  }
  return s + '</svg>';
}

// Field in meters: home plate at origin, +y toward CF, foul lines at ±45°.
const FW = 366, FH = 330, SCALE = 2.1, HX = FW/2, HY = FH - 14;
const toPx = (x, y) => [HX + x*SCALE, HY - y*SCALE];
const toM = (px, py) => [(px - HX)/SCALE, (HY - py)/SCALE];
// Fence distance at spray angle a (deg, -45 = LF line, +45 = RF line).
function fenceAt(a){
  // Unknown gap distance: midpoint of line and CF + 6 m (avg bulge of the parks with known gaps).
  const f = G.fence.f, r = f.map((v, i) => v ?? ((i === 1 ? f[0] : f[4]) + f[2]) / 2 + 6);
  const u = Math.min(3.9999, Math.max(0, (a + 45) / 22.5)), i = Math.floor(u), t = u - i;
  const p0 = r[Math.max(0, i-1)], p1 = r[i], p2 = r[i+1], p3 = r[Math.min(4, i+2)];
  // Catmull-Rom on radius vs angle: smooth through every known distance.
  return 0.5*((2*p1) + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t*t + (-p0+3*p1-3*p2+p3)*t*t*t);
}
// Straight-wall parks (e.g. 대구): distance along angle a to the wall segment between key points.
function wallAt(a){
  const f = G.fence.f, keys = [-45, -22.5, 0, 22.5, 45];
  const i = Math.min(3, Math.max(0, Math.floor((a + 45) / 22.5)));
  const P = k => [f[k]*Math.sin(keys[k]*Math.PI/180), f[k]*Math.cos(keys[k]*Math.PI/180)];
  const [x1, y1] = P(i), [x2, y2] = P(i+1), dx = Math.sin(a*Math.PI/180), dy = Math.cos(a*Math.PI/180);
  const ex = x2-x1, ey = y2-y1;
  return (x1*ey - y1*ex) / (dx*ey - dy*ex);
}
const fenceDist = a => G.fence.straight ? wallAt(a) : fenceAt(a);
function fencePath(){
  const pt = (a, d) => { const rad = a*Math.PI/180; return toPx(d*Math.sin(rad), d*Math.cos(rad)); };
  const angles = G.fence.straight ? [-45, -22.5, 0, 22.5, 45] : [...Array(91).keys()].map(k => k - 45);
  return angles.map(a => pt(a, fenceDist(a)).join(' ')).join(' L');
}
function fieldSVG(pa){
  const b = 27.43/Math.SQRT2;
  const lbl = (a, i) => { const rad = a*Math.PI/180, d = G.fence.f[i]; if (d == null) return '';
    const [x, y] = toPx((d+5)*Math.sin(rad), (d+5)*Math.cos(rad));
    return `<text x="${x}" y="${y}" text-anchor="middle" font-size="9" fill="#5c6672">${d}${G.fence.src[i]==='ok'?'':'*'}</text>`; };
  let s = `<svg id="field" viewBox="0 0 ${FW} ${FH}">
    <path d="M${HX} ${HY} L${fencePath()} Z" fill="rgba(34,197,94,.06)" stroke="#3a5a44" stroke-width="1.5"/>
    <path d="M${HX} ${HY} L${toPx(-b,b)} L${toPx(0,2*b)} L${toPx(b,b)} Z" fill="rgba(160,120,80,.12)" stroke="#4a5566"/>
    <circle cx="${toPx(0,18.44)[0]}" cy="${toPx(0,18.44)[1]}" r="4" fill="#4a5566"/>
    ${[-45, -22.5, 0, 22.5, 45].map(lbl).join('')}`;
  for (const [k, v] of Object.entries(landings)){
    const [x, y] = toPx(v.x, v.y), cur = +k === pa.no, col = RES_COL[v.res] || '#8b95a3';
    if (cur){
      s += `<line x1="${HX}" y1="${HY}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      const path = (v.path || []).map(([px, py]) => toPx(px, py));
      if (path.length){
        s += `<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${[[x, y], ...path].map(q => q.join(',')).join(' ')}"/>`;
        path.forEach(([px, py], i) => s += i === path.length-1
          ? `<circle cx="${px}" cy="${py}" r="6" fill="#0d1014" stroke="${col}" stroke-width="2.5"/>`
          : `<circle cx="${px}" cy="${py}" r="3" fill="${col}"/>`);
      }
    }
    s += `<circle cx="${x}" cy="${y}" r="${cur?8:4.5}" fill="${col}" opacity="${cur?1:.6}" ${cur?'stroke="#0d1014" stroke-width="2"':''}/>`;
  }
  return s + '</svg>';
}
function landingInfo(v){
  const d = Math.hypot(v.x, v.y), a = Math.atan2(v.x, v.y)*180/Math.PI;
  const fence = Math.abs(a) <= 45 ? ` · 펜스 ${Math.round(fenceDist(a))}m` : ' · 파울지역';
  let roll = 0, prev = [v.x, v.y];
  for (const q of v.path || []){ roll += Math.hypot(q[0]-prev[0], q[1]-prev[1]); prev = q; }
  return `${Math.round(d)}m${fence}${roll ? ` · 이후 ${Math.round(roll)}m` : ''}`;
}

function render(){
  if (view !== 'chart') return renderOther();
  const pa = G.pas[idx], n = G.names, st = pa.pitches[pa.pitches.length-1].state, a = pa.after;
  const half = `${pa.inn}회${pa.top?'초':'말'}`;
  const outs = pa.before.out;
  const saved = landings[pa.no];
  const isOut = /아웃|병살/.test(pa.result || '');
  let log = pa.pitches.map(p => `<div class="r"><span class="pn">${p.n}</span><span class="ty">${p.stuff||'-'}</span><span class="ve">${p.speed?p.speed+'㎞':''}</span><span>${CALL[p.call]?.[0]||p.call}</span><span class="rs" style="color:${CALL[p.call]?.[1]}">${p.call}</span></div>`).join('');
  log += pa.events.map(e => `<div class="ev">${e}</div>`).join('');
  document.getElementById('app').innerHTML = `
  <div class="top"><button class="ico" id="prev">‹</button>
    <div class="mid">${half} · <span class="dim">${G.awayName}</span> ${a.awayScore} : ${a.homeScore} <span class="dim">${G.homeName}</span></div>
    <button class="ico" id="next">›</button></div>
  <div class="mu">
    <div class="side"><div class="r">P</div><div class="n">${n[pa.pitcher]||pa.pitcher}</div><div class="s">${pa.pitcherPitches}구 · ${(G.hands[pa.pitcher]||'').slice(0,2)}</div></div>
    <div class="arw">→</div>
    <div class="side"><div class="r">AB</div><div class="n">${n[pa.batter]||pa.batter} <span style="font-size:11px;color:var(--muted)">${pa.title.split('번')[0]}번</span></div><div class="s">${(G.hands[pa.batter]||'').slice(2)}</div></div>
    <div class="cnt"><div class="bs">${st.ball}-${st.strike}</div><div class="o">${'●'.repeat(outs)}${'○'.repeat(3-outs)} ${outs}아웃</div></div>
  </div>
  <div class="zonewrap">
    <div class="card zonecard"><div class="cap">투구 위치 · 포수 시점</div>${zoneSVG(pa)}</div>
    <div class="leg">
      <div class="it"><span class="d" style="background:var(--strike)"></span>스트라이크</div>
      <div class="it"><span class="d" style="background:var(--ball)"></span>볼</div>
      <div class="it"><span class="d" style="background:var(--foul)"></span>파울</div>
      <div class="it"><span class="d" style="border:2px dashed var(--inplay)"></span>인플레이</div>
      <div class="src">네이버 PTS<br>자동 반영</div>
    </div>
  </div>
  <div class="log">${log}</div>
  ${pa.result ? `<div class="result ${isOut?'out':''}">${pa.result}</div>` : ''}
  ${pa.inPlay ? `
    <div class="sect"><span>${saved ? '② 이후 타구 흐름 · 탭 (선택)' : '① 최초 낙구지점 · 탭'}</span><span class="saved">${saved?`저장됨 · ${landingInfo(saved)}`:''}</span></div>
    <div class="card fieldcard">${fieldSVG(pa)}</div>
    ${saved ? `<div class="pathbar"><button id="undo">↶ 되돌리기</button><button id="clear">지우기</button><span>흐름 ${saved.path?.length||0}점</span></div>` : ''}
    <div class="fnote">${G.stadium||'구장 미상'} 펜스 기준${G.fence.src.some(x=>x!=='ok')?' · * 추정/비공식 수치':''}</div>
    <div class="sect"><span>결과</span><span>${saved?.resManual?'직접 수정':'네이버 판정 자동'}</span></div>
    <div class="chips res">${RES.map(([k,l,c]) => `<button class="chip ${curRes(pa)===k?'sel':''}" data-r="${k}" style="${curRes(pa)===k?`border-color:${c};color:${c};background:${c}1a`:''}">${l}</button>`).join('')}</div>
    <div class="sect"><span>궤적</span></div>
    <div class="chips">${TRAJ.map(t => `<button class="chip ${saved?.traj===t?'sel':''}" data-t="${t}">${t}</button>`).join('')}</div>` : ''}
  <div class="nav"><button id="prev2">← 이전 타석</button><button class="next" id="next2">${nextInPlayLabel()}</button></div>
  <div class="foot"><span>${idx+1} / ${G.pas.length} 타석 · 낙구 ${Object.keys(landings).length}개</span><button id="export">JSON 복사</button></div>${tabsHTML()}`;
  bindTabs();
  const go = d => { idx = Math.max(0, Math.min(G.pas.length-1, idx+d)); location.hash = `pa-${idx}`; render(); };
  for (const [id, d] of [['prev',-1],['prev2',-1],['next',1]]) document.getElementById(id).onclick = () => go(d);
  document.getElementById('next2').onclick = () => { const j = G.pas.findIndex((p,i) => i > idx && p.inPlay); go((j<0?G.pas.length-1:j) - idx); };
  document.getElementById('export').onclick = exportJSON;
  const f = document.getElementById('field');
  if (f) f.onclick = e => {
    const r = f.getBoundingClientRect(), k = FW / r.width;
    const [x, y] = toM((e.clientX - r.left)*k, (e.clientY - r.top)*k);
    const pt = [Math.round(x*10)/10, Math.round(y*10)/10], cur = landings[pa.no];
    if (cur) (cur.path ??= []).push(pt);
    else landings[pa.no] = {unit:'m', x:pt[0], y:pt[1], path:[], res:pa.res, inn:pa.inn, batter:pa.batter, result:pa.result, at:Date.now()};
    persist(); render();
  };
  const undo = document.getElementById('undo');
  if (undo) undo.onclick = () => { const v = landings[pa.no]; if (v.path?.length) v.path.pop(); else delete landings[pa.no]; persist(); render(); };
  const clr = document.getElementById('clear');
  if (clr) clr.onclick = () => { delete landings[pa.no]; persist(); render(); };
  document.querySelectorAll('.chip[data-t]').forEach(c => c.onclick = () => {
    if (!landings[pa.no]) return;
    landings[pa.no].traj = c.dataset.t; persist(); render();
  });
  document.querySelectorAll('.chip[data-r]').forEach(c => c.onclick = () => {
    if (!landings[pa.no]) return;
    landings[pa.no].res = c.dataset.r; landings[pa.no].resManual = c.dataset.r !== pa.res; persist(); render();
  });
}
const TABS = [['chart','차팅'],['log','로그'],['box','박스'],['pitcher','투수'],['wp','승률']];
const VIEWS = {chart:null, log:viewLog, box:viewBox, pitcher:viewPitcher, wp:viewWP};
const TYPE_COL = ['#f59e0b','#3b82f6','#a855f7','#22c55e','#ef4444','#14b8a6','#ec4899','#eab308','#64748b'];
const halfName = pa => `${pa.inn}회${pa.top?'초':'말'}`;
function tabsHTML(){ return `<nav class="tabs">${TABS.map(([k,l]) => `<button data-v="${k}" class="${view===k?'on':''}">${l}</button>`).join('')}</nav>`; }
function bindTabs(){
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    view = b.dataset.v; location.hash = view === 'chart' ? `pa-${idx}` : view; scrollTo(0,0); render();
  });
}
function renderOther(){
  document.getElementById('app').innerHTML = VIEWS[view]() + tabsHTML();
  bindTabs();
  document.querySelectorAll('[data-pa]').forEach(e => e.onclick = () => { idx = +e.dataset.pa; view = 'chart'; location.hash = `pa-${idx}`; scrollTo(0,0); render(); });
  document.querySelectorAll('[data-p]').forEach(e => e.onclick = () => { pitcherSel = e.dataset.p; render(); });
}
function scoreLine(){ const a = G.pas[G.pas.length-1].after; return `${G.awayName} ${a.awayScore} : ${a.homeScore} ${G.homeName}`; }

function viewLog(){
  let h = `<div class="h1">플레이 로그</div><div class="sub">${scoreLine()} · ${G.pas.length}타석</div>`, cur = null;
  G.pas.forEach((pa, i) => {
    const hn = halfName(pa);
    if (hn !== cur){ cur = hn; h += `<div class="half">${hn} · ${pa.top?G.awayName:G.homeName} 공격</div>`; }
    const nxt = G.pas[i+1], last = !nxt || halfName(nxt) !== hn;
    const chg = pa.after.awayScore !== pa.before.awayScore || pa.after.homeScore !== pa.before.homeScore;
    const seq = pa.pitches.map(p => `<i style="background:${CALL[p.call]?.[1]}">${p.call}</i>`).join('');
    const res = (pa.result || pa.events[pa.events.length-1] || '').replace(/^[^:]+ : /, '');
    h += `<div class="pa ${last?'last':''}" data-pa="${i}"><div class="who">${G.names[pa.batter]||''}<small>${pa.title.split('번')[0]}번 · ${pa.pitches.length}구</small></div>
      <div class="what">${res}${pa.events.length?`<div style="color:var(--dim);font-size:11px;margin-top:3px">${pa.events.map(e=>e.replace(/^[^:]+ : /,'')).join(' · ')}</div>`:''}<div class="seq">${seq}</div></div>
      <div class="sc ${chg?'chg':''}">${pa.after.awayScore}:${pa.after.homeScore}</div></div>`;
  });
  return h;
}

function viewBox(){
  const is = G.inningScore, n = Object.keys(is.away).length, a = G.pas[G.pas.length-1].after;
  const cols = [...Array(n).keys()].map(i => i+1);
  let h = `<div class="h1">박스스코어</div><div class="sub">${scoreLine()} · 최종</div>
  <div class="card tbl"><table class="ls"><tr><th>팀</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>R</th><th>H</th><th>E</th></tr>
    <tr><td>${G.awayName}</td>${cols.map(c=>`<td>${is.away[c]}</td>`).join('')}<td class="rhe">${a.awayScore}</td><td class="rhe">${a.awayHit}</td><td class="rhe">${a.awayError}</td></tr>
    <tr><td>${G.homeName}</td>${cols.map(c=>`<td>${is.home[c]}</td>`).join('')}<td class="rhe">${a.homeScore}</td><td class="rhe">${a.homeHit}</td><td class="rhe">${a.homeError}</td></tr></table></div>`;
  for (const side of ['away','home']){
    const L = G.lineups[side], name = side === 'away' ? G.awayName : G.homeName;
    const bat = [...L.batter].sort((x,y) => x.batOrder - y.batOrder || x.seqno - y.seqno);
    const sum = k => bat.reduce((t,b) => t + (+b[k]||0), 0);
    h += `<div class="sect"><span>타격 · ${name}</span></div><div class="card tbl"><table><tr><th>선수</th><th>타수</th><th>안타</th><th>타점</th><th>득점</th><th>볼넷</th><th>삼진</th></tr>
      ${bat.map(b => `<tr class="${b.seqno>1?'subp':''}"><td>${b.seqno>1?'':b.batOrder+' '}${b.name}<span class="pos">${b.posName||''}</span></td><td>${b.ab}</td><td>${b.hit}</td><td>${b.rbi}</td><td>${b.run}</td><td>${b.bb}</td><td>${b.so}</td></tr>`).join('')}
      <tr class="tot"><td>합계</td><td>${sum('ab')}</td><td>${sum('hit')}</td><td>${sum('rbi')}</td><td>${sum('run')}</td><td>${sum('bb')}</td><td>${sum('so')}</td></tr></table></div>`;
    h += `<div class="card tbl" style="margin-top:6px"><table><tr><th>투수</th><th>이닝</th><th>투구</th><th>피안타</th><th>삼진</th><th>볼넷</th><th>자책</th></tr>
      ${[...L.pitcher].sort((x,y)=>x.seqno-y.seqno).map(p => `<tr><td>${p.name}</td><td>${p.inn}</td><td>${p.ballCount}</td><td>${p.hit}</td><td>${p.kk}</td><td>${p.bb}</td><td>${p.er}</td></tr>`).join('')}</table></div>`;
  }
  return h;
}

function viewPitcher(){
  const order = [...new Set(G.pas.flatMap(p => p.pitches.map(q => q.pitcher)))];
  if (!pitcherSel || !order.includes(pitcherSel)) pitcherSel = order[0];
  const mine = G.pas.filter(p => p.pitches.some(q => q.pitcher === pitcherSel)), ps = mine.flatMap(p => p.pitches).filter(q => q.pitcher === pitcherSel);
  const rec = [...G.lineups.away.pitcher, ...G.lineups.home.pitcher].find(p => p.pcode === pitcherSel) || {};
  const groups = {};
  for (const p of ps){ (groups[p.stuff||'기타'] ??= []).push(p); }
  const types = Object.entries(groups).sort((a,b) => b[1].length - a[1].length);
  const col = Object.fromEntries(types.map(([t], i) => [t, TYPE_COL[i % TYPE_COL.length]]));
  const strikes = ps.filter(p => p.call !== 'B').length;
  const W = 220, H = 230, sx = x => W/2 + x*48, sz = z => H - 14 - z*40;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect x="${sx(-0.708)}" y="${sz(3.4)}" width="${sx(0.708)-sx(-0.708)}" height="${sz(1.6)-sz(3.4)}" fill="rgba(245,158,11,.05)" stroke="#4a5566" stroke-width="1.5"/>`;
  for (const p of ps) if (p.xz) svg += `<circle cx="${Math.max(6, Math.min(W-6, sx(p.xz[0])))}" cy="${Math.max(6, Math.min(H-6, sz(p.xz[1])))}" r="5" fill="${col[p.stuff||'기타']}" opacity=".8"/>`;
  svg += `<line x1="${sx(-0.708)}" y1="${H-6}" x2="${sx(0.708)}" y2="${H-6}" stroke="#4a5566" stroke-width="2"/></svg>`;
  const team = G.lineups.away.pitcher.some(p => p.pcode === pitcherSel) ? G.awayName : G.homeName;
  return `<div class="h1">투수 분석</div><div class="sub">${team} · ${(G.hands[pitcherSel]||'').slice(0,2)} · 이 경기</div>
  <div class="pchips">${order.map(c => `<button data-p="${c}" class="${c===pitcherSel?'on':''}">${G.names[c]}</button>`).join('')}</div>
  <div class="kpis"><div class="card kpi"><b>${rec.inn ?? '-'}</b><span>이닝</span></div><div class="card kpi"><b>${ps.length}</b><span>투구</span></div>
    <div class="card kpi"><b>${rec.kk ?? '-'}</b><span>삼진</span></div><div class="card kpi"><b>${ps.length?Math.round(strikes/ps.length*100):0}%</b><span>스트라이크</span></div></div>
  <div class="sect"><span>구종 구사 · 평균 구속</span><span>${mine.length}타자 상대</span></div>
  <div class="card mix">${types.map(([t, arr]) => {
    const v = arr.filter(p => p.speed).map(p => +p.speed), avg = v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : '-';
    const pct = Math.round(arr.length/ps.length*100);
    return `<div class="row"><span class="nm"><span class="dot" style="background:${col[t]}"></span>${t}</span><div class="bar"><div style="width:${pct}%;background:${col[t]}"></div></div><span class="pct">${pct}%</span><span class="v">${avg}㎞</span></div>`;
  }).join('')}</div>
  <div class="sect"><span>투구 위치 · 포수 시점</span><span>${ps.length}구</span></div>
  <div class="card zc">${svg}</div>`;
}

function viewWP(){
  const pts = [{i:0, wr:50, pa:null}];
  G.pas.forEach((pa, i) => { const m = pa.wp; if (m && (m.homeTeamWinRate || m.awayTeamWinRate)) pts.push({i:i+1, wr:m.homeTeamWinRate, pa, idx:i}); });
  for (let k = 1; k < pts.length; k++) pts[k].d = pts[k].wr - pts[k-1].wr;
  const W = 350, H = 180, X = i => 10 + i/G.pas.length*(W-20), Y = w => 10 + (100-w)/100*(H-20);
  let svg = `<svg width="100%" viewBox="0 0 ${W} ${H}"><line x1="10" x2="${W-10}" y1="${Y(50)}" y2="${Y(50)}" stroke="#2b333f" stroke-dasharray="3 3"/>`;
  let innX = '', prev = 0;
  G.pas.forEach((pa, i) => { if (pa.inn !== prev && pa.top){ prev = pa.inn; innX += `<line x1="${X(i)}" x2="${X(i)}" y1="10" y2="${H-10}" stroke="#1e2630"/><text x="${X(i)+3}" y="${H-2}" font-size="9" fill="#5c6672">${pa.inn}</text>`; } });
  svg += innX + `<polyline fill="none" stroke="var(--inplay)" stroke-width="2" points="${pts.map(p => `${X(p.i)},${Y(p.wr)}`).join(' ')}"/>`;
  const top3 = pts.filter(p => p.pa).sort((a,b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 5);
  for (const p of top3) svg += `<circle cx="${X(p.i)}" cy="${Y(p.wr)}" r="4" fill="var(--inplay)" stroke="#0d1014" stroke-width="2"/>`;
  svg += `<text x="12" y="20" font-size="9" fill="#5c6672">${G.homeName} 100%</text><text x="12" y="${H-14}" font-size="9" fill="#5c6672">${G.awayName} 100%</text></svg>`;
  const fin = pts[pts.length-1].wr;
  return `<div class="h1">승부 확률</div><div class="sub">${scoreLine()} · ${G.homeName} 승리확률 기준 · 네이버 제공값</div>
  <div class="card wpc">${svg}</div>
  <div class="sect"><span>결정적 장면 · 승리확률 변동</span><span>최종 ${G.homeName} ${Math.round(fin)}%</span></div>
  <div class="swings">${top3.map((p, k) => `<div class="swing" data-pa="${p.idx}"><span class="rk">${k+1}</span><div class="tx">${(p.pa.result||p.pa.events.join(' · ')).replace(/^[^:]+ : /, `${G.names[p.pa.batter]} `)}<small>${halfName(p.pa)} · ${p.pa.top?G.awayName:G.homeName} 공격 · ${p.pa.after.awayScore}:${p.pa.after.homeScore}</small></div>
    <span class="d" style="color:${p.d>0?'var(--inplay)':'var(--out)'}">${p.d>0?'+':''}${p.d.toFixed(1)}%p</span></div>`).join('')}</div>`;
}

function curRes(pa){ return landings[pa.no]?.res || pa.res; }
function nextInPlayLabel(){ return G.pas.some((p,i) => i > idx && p.inPlay) ? '다음 인플레이 →' : '마지막 →'; }
function persist(){ try { localStorage.setItem(STORE, JSON.stringify(landings)); } catch {} }
function exportJSON(e){
  const btn = e.currentTarget;
  navigator.clipboard.writeText(JSON.stringify({gameId:GAME, landings}, null, 2))
    .then(() => { btn.textContent = '복사됨'; }, () => { btn.textContent = '복사 실패'; });
}

load().then(g => {
  G = g;
  const m = location.hash.match(/^#pa-(\d+)$/); if (m) idx = Math.min(+m[1], G.pas.length-1);
  const v = location.hash.slice(1); if (VIEWS[v] !== undefined && v !== 'chart') view = v;
  render();
}).catch(e => { document.getElementById('app').innerHTML = `<div class="err">${e.message}<br>repo 루트에서 <code>python3 -m http.server</code> 후 /web/ 로 여세요.</div>`; });
</script>
</body>
</html>
