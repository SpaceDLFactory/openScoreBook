<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{--bg:#0d1014;--panel:#161b22;--panel2:#1d232c;--line:#262d38;--txt:#e7ecf2;--muted:#8b95a3;--dim:#5c6672;--hit:#22c55e;
      --ff:#ef4444;--sl:#f59e0b;--cb:#8b5cf6;--ch:#22c55e;--fk:#38bdf8;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
    body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;width:390px;padding:0 0 20px;}
    a{color:var(--hit);} a:hover{color:#16a34a;}
    .top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
    .top h1{font-size:19px;font-weight:800;}
    .top .who{font-size:12px;color:var(--muted);}
    .tabs{display:flex;gap:8px;margin:6px 16px 0;}
    .tab{font-size:13px;font-weight:700;padding:7px 14px;border-radius:9px;border:1px solid var(--line);color:var(--muted);background:var(--panel);}
    .tab.on{color:#7ee2a4;border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08);}
    .kpis{display:flex;gap:10px;margin:12px 16px 0;}
    .kpi{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 0;text-align:center;}
    .kpi b{font-size:18px;font-weight:800;display:block;font-variant-numeric:tabular-nums;}
    .kpi span{font-size:10px;color:var(--muted);}
    .card{margin:12px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;}
    .card .h{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;}
    .card .h .sub{font-size:10px;color:var(--dim);font-weight:600;}
    /* pitch mix rows */
    .mix .row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
    .mix .row:last-child{margin-bottom:0;}
    .mix .lb{width:58px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
    .mix .lb .sw{width:9px;height:9px;border-radius:2px;}
    .mix .bar{flex:1;height:9px;border-radius:5px;background:var(--panel2);overflow:hidden;}
    .mix .bar i{display:block;height:100%;border-radius:5px;}
    .mix .pct{width:34px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;}
    .mix .velo{width:56px;text-align:right;font-size:11px;color:var(--muted);}
    /* heatmap */
    .zone{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:170px;margin:4px auto 0;}
    .zc{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--txt);}
    .cap{text-align:center;font-size:10px;color:var(--dim);margin-top:8px;}
  </style>
</helmet>
<div class="top"><h1>곽 빈 <span class="who">두산 · 우투</span></h1><span class="who">이 경기 ▾</span></div>
<div class="tabs"><div class="tab">구종 믹스</div><div class="tab on">투수 요약</div><div class="tab">피안타</div></div>

<div class="kpis">
  <div class="kpi"><b>5.1</b><span>이닝</span></div>
  <div class="kpi"><b>88</b><span>투구수</span></div>
  <div class="kpi"><b>4</b><span>탈삼진</span></div>
  <div class="kpi"><b>146</b><span>평균 직구</span></div>
</div>

<div class="card mix">
  <div class="h"><span>구종 구사 비율</span><span class="sub">88구 기준 · 평균구속</span></div>
  <div class="row"><span class="lb"><span class="sw" style="background:var(--ff)"></span>직구</span><span class="bar"><i style="width:48%;background:var(--ff)"></i></span><span class="pct">48%</span><span class="velo">146㎞</span></div>
  <div class="row"><span class="lb"><span class="sw" style="background:var(--sl)"></span>슬라</span><span class="bar"><i style="width:26%;background:var(--sl)"></i></span><span class="pct">26%</span><span class="velo">133㎞</span></div>
  <div class="row"><span class="lb"><span class="sw" style="background:var(--cb)"></span>커브</span><span class="bar"><i style="width:14%;background:var(--cb)"></i></span><span class="pct">14%</span><span class="velo">118㎞</span></div>
  <div class="row"><span class="lb"><span class="sw" style="background:var(--fk)"></span>포크</span><span class="bar"><i style="width:12%;background:var(--fk)"></i></span><span class="pct">12%</span><span class="velo">137㎞</span></div>
</div>

<div class="card">
  <div class="h"><span>투구 위치 밀도 · 포수 시점</span><span class="sub">전체 88구</span></div>
  <div class="zone">
    <div class="zc" style="background:rgba(239,68,68,.16)">9</div>
    <div class="zc" style="background:rgba(239,68,68,.30)">14</div>
    <div class="zc" style="background:rgba(239,68,68,.20)">11</div>
    <div class="zc" style="background:rgba(239,68,68,.24)">12</div>
    <div class="zc" style="background:rgba(239,68,68,.12)">7</div>
    <div class="zc" style="background:rgba(239,68,68,.40)">18</div>
    <div class="zc" style="background:rgba(239,68,68,.10)">5</div>
    <div class="zc" style="background:rgba(239,68,68,.14)">8</div>
    <div class="zc" style="background:rgba(239,68,68,.22)">11</div>
  </div>
  <div class="cap">바깥쪽 낮은 코스(우타 기준) 집중 — 슬라이더 유인구 다수</div>
</div>
</x-dc>
</body>
</html>
